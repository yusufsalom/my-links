<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الراوي | روابطي الشخصية</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #0f172a; color: #fff; text-align: center; padding: 30px 15px; margin: 0; }
        .container { max-width: 420px; margin: 0 auto; }
        .avatar { width: 85px; height: 85px; border-radius: 50%; background: linear-gradient(135deg, #3b82f6, #1d4ed8); margin: 0 auto 12px; display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        h1 { font-size: 20px; margin-bottom: 5px; }
        p { color: #94a3b8; font-size: 13px; margin-bottom: 25px; }
        .links-list { display: flex; flex-direction: column; gap: 10px; }
        .link-btn { display: block; background: #1e293b; color: #fff; text-decoration: none; padding: 14px; border-radius: 12px; border: 1px solid #334155; transition: 0.2s; font-weight: bold; font-size: 14px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .link-btn:hover { background: #334155; border-color: #3b82f6; transform: translateY(-2px); }
        .footer { margin-top: 30px; color: #64748b; font-size: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="avatar">الراوي</div>
        <h1>الراوي</h1>
        <p>روابط حساباتي ومنصاتي الرسمية</p>
        
        <div class="links-list">
            <!-- استبدل # برابطك الحقيقي لكل منصة -->
            <a href="https://youtube.com" class="link-btn" target="_blank">يوتيوب (YouTube)</a>
            <a href="https://instagram.com" class="link-btn" target="_blank">انستقرام (Instagram)</a>
            <a href="https://snapchat.com" class="link-btn" target="_blank">سناب شات (Snapchat)</a>
            <a href="https://tiktok.com" class="link-btn" target="_blank">تيك توك (TikTok)</a>
            <a href="https://x.com" class="link-btn" target="_blank">تويتر / إكس (X)</a>
            <a href="https://t.me" class="link-btn" target="_blank">تليقرام (Telegram)</a>
            <a href="https://drive.google.com" class="link-btn" target="_blank">ملفات جوجل (Google Drive)</a>
            <a href="https://apple.com" class="link-btn" target="_blank">تطبيقات المتجر (App Store)</a>
        </div>

        <div class="footer">
            جميع الحقوق محفوظة © الراوي
        </div>
    </div>
</body>
</html>
